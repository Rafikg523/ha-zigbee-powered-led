[project]
name = "ha-zigbee-powered-led"
version = "0.3.7"
description = "Home Assistant integration for Zigbee LED controllers behind power relays"
requires-python = ">=3.14"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-p no:respx"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 88
